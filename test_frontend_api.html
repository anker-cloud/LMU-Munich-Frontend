<!DOCTYPE html>
<html>
<head>
    <title>Frontend API Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
        pre { background: #2d2d2d; padding: 15px; border-radius: 5px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
    </style>
</head>
<body>
    <h1>Frontend API Test - Patient List Debug</h1>

    <button onclick="testDirect()">Test Direct API (Production Mode)</button>
    <button onclick="testProxy()">Test Proxy API (Dev Mode)</button>

    <h2>Results:</h2>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        async function testDirect() {
            results.innerHTML = '<p>Testing direct API call to http://35.159.51.22:8000/patients...</p>';
            try {
                const response = await fetch('http://35.159.51.22:8000/patients');
                const data = await response.json();

                results.innerHTML += `
                    <div class="success">
                        <h3>✓ Direct API Success</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p>Patient count: ${data.patients?.length || 0}</p>
                        <p>First 5 patients: ${data.patients?.slice(0, 5).join(', ')}</p>
                    </div>
                `;
            } catch (error) {
                results.innerHTML += `
                    <div class="error">
                        <h3>✗ Direct API Failed</h3>
                        <pre>${error.message}</pre>
                        <p>This is likely a CORS issue. Check browser console for details.</p>
                    </div>
                `;
            }
        }

        async function testProxy() {
            results.innerHTML = '<p>Testing proxy API call to /api/patients...</p>';
            try {
                const response = await fetch('/api/patients');
                const data = await response.json();

                results.innerHTML += `
                    <div class="success">
                        <h3>✓ Proxy API Success</h3>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                        <p>Patient count: ${data.patients?.length || 0}</p>
                        <p>First 5 patients: ${data.patients?.slice(0, 5).join(', ')}</p>
                    </div>
                `;
            } catch (error) {
                results.innerHTML += `
                    <div class="error">
                        <h3>✗ Proxy API Failed</h3>
                        <pre>${error.message}</pre>
                        <p>Make sure dev server is running on port 5173</p>
                    </div>
                `;
            }
        }

        // Auto-test on load
        window.onload = () => {
            console.log('Testing both endpoints...');
            testDirect();
        };
    </script>
</body>
</html>
